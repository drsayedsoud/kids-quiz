<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- يد تحكم بإحساس ثلاثي الأبعاد، تميل يميناً ويساراً -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#e6ecf7"/><stop offset="1" stop-color="#9fb0d4"/></linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b7fd6"/><stop offset="1" stop-color="#2f4fa8"/></linearGradient>
    <radialGradient id="bR" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#ff9a9a"/><stop offset="1" stop-color="#d62c2c"/></radialGradient>
    <radialGradient id="bG" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#9df2c0"/><stop offset="1" stop-color="#1fa35c"/></radialGradient>
    <radialGradient id="bY" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#ffe89a"/><stop offset="1" stop-color="#e0a000"/></radialGradient>
    <radialGradient id="bB" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#9ad0ff"/><stop offset="1" stop-color="#1f6fd6"/></radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0b1f4a" flood-opacity="0.35"/></filter>
  </defs>
  <g filter="url(#sh)">
    <animateTransform attributeName="transform" type="rotate" values="-6 48 52;6 48 52;-6 48 52" dur="2.6s" repeatCount="indefinite"/>
    <path d="M22 30h52c9 0 14 7 15 16l3 22c1 7-4 12-10 12-5 0-8-3-11-7l-5-7H30l-5 7c-3 4-6 7-11 7-6 0-11-5-10-12l3-22c1-9 6-16 15-16z" fill="url(#grip)"/>
    <path d="M24 26h48c8 0 13 6 13 14v10c0 8-5 14-13 14H24c-8 0-13-6-13-14V40c0-8 5-14 13-14z" fill="url(#body)"/>
    <path d="M28 30h40c5 0 8 3 8 7v3c0 2-2 3-4 3H24c-2 0-4-1-4-3v-3c0-4 3-7 8-7z" fill="#fff" opacity="0.55"/>
    <!-- الأسهم -->
    <rect x="24" y="42" width="8" height="20" rx="2.5" fill="#3d4a66"/><rect x="18" y="48" width="20" height="8" rx="2.5" fill="#3d4a66"/>
    <rect x="25" y="43" width="6" height="6" rx="1.5" fill="#6b7a99"/>
    <!-- الأزرار -->
    <circle cx="68" cy="45" r="4.6" fill="url(#bY)"/><circle cx="76" cy="52" r="4.6" fill="url(#bR)"/><circle cx="60" cy="52" r="4.6" fill="url(#bB)"/><circle cx="68" cy="59" r="4.6" fill="url(#bG)">
      <animate attributeName="r" values="4.6;3.6;4.6" dur="1.3s" repeatCount="indefinite"/></circle>
    <rect x="42" y="50" width="12" height="4" rx="2" fill="#7c8aa8"/>
