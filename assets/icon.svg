<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- أيقونة «بطل المستقبل»: طفل بطل بعباءة يطير لأعلى ممسكاً بنجمة ذهبية، على سماء زرقاء متدرجة -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f8ff5"/><stop offset="0.6" stop-color="#6fc1ff"/><stop offset="1" stop-color="#bfe6ff"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.55"><stop offset="0" stop-color="#fff" stop-opacity="0.5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="cape" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a59"/><stop offset="1" stop-color="#d9482e"/></linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b7fd6"/><stop offset="1" stop-color="#2f4fa8"/></linearGradient>
    <radialGradient id="skin" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#ffe3c9"/><stop offset="1" stop-color="#e4a67c"/></radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2a8"/><stop offset="0.5" stop-color="#ffd23f"/><stop offset="1" stop-color="#f0a500"/></linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ee3ad"/><stop offset="1" stop-color="#3ecf8e"/></linearGradient>
    <clipPath id="round"><rect x="0" y="0" width="512" height="512" rx="112"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0b2a5c" flood-opacity="0.35"/></filter>
  </defs>
  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <ellipse cx="256" cy="230" rx="230" ry="190" fill="url(#glow)"/>
    <!-- سحب صغيرة -->
    <g fill="#fff" opacity="0.9">
      <ellipse cx="96" cy="150" rx="48" ry="18"/><circle cx="80" cy="140" r="18"/><circle cx="108" cy="134" r="22"/>
      <ellipse cx="430" cy="112" rx="40" ry="15"/><circle cx="418" cy="104" r="15"/><circle cx="440" cy="99" r="18"/>
    </g>
    <!-- تلال -->
    <path d="M-20 512 C 90 420, 200 420, 300 470 S 470 430, 540 480 V512 Z" fill="url(#hill)"/>
    <!-- نجوم صغيرة -->
    <g fill="#fff" opacity="0.95">
      <path d="M392 190l6 14 15 2-11 10 3 15-13-7-13 7 3-15-11-10 15-2z"/>
      <path d="M112 260l4 9 10 1.5-7 7 2 10-9-5-9 5 2-10-7-7 10-1.5z"/>
      <path d="M400 330l3 7 7 1-5 5 1.5 7-6.5-3.5-6.5 3.5 1.5-7-5-5 7-1z"/>
    </g>
    <!-- البطل -->
    <g filter="url(#sh)" transform="translate(6 0)">
      <!-- العباءة -->
      <path d="M232 250 C 190 300, 150 372, 128 430 C 190 400, 236 390, 300 392 C 292 340, 296 300, 300 262 Z" fill="url(#cape)"/>
      <!-- الجسم -->
      <path d="M212 246 c 0 -22 18 -34 44 -34 s 44 12 44 34 v 70 c 0 30 -20 42 -44 42 s -44 -12 -44 -42 z" fill="url(#suit)"/>
      <!-- الشعار على الصدر -->
      <path d="M256 266l7 15 16 2-12 11 3 16-14-8-14 8 3-16-12-11 16-2z" fill="#ffd23f"/>
      <!-- الذراع الممدودة للأعلى تمسك النجمة -->
      <path d="M294 262 c 20 -30 40 -70 46 -120" fill="none" stroke="url(#suit)" stroke-width="26" stroke-linecap="round"/>
      <circle cx="340" cy="140" r="15" fill="url(#skin)"/>
      <!-- الذراع الأخرى -->
      <path d="M216 268 c -22 12 -38 34 -44 60" fill="none" stroke="url(#suit)" stroke-width="24" stroke-linecap="round"/>
      <circle cx="172" cy="330" r="13" fill="url(#skin)"/>
      <!-- الساقان -->
      <path d="M236 352 c -6 34 -4 58 8 80" fill="none" stroke="url(#suit)" stroke-width="26" stroke-linecap="round"/>
      <path d="M276 352 c 10 30 22 50 40 66" fill="none" stroke="url(#suit)" stroke-width="26" stroke-linecap="round"/>
      <ellipse cx="248" cy="440" rx="18" ry="11" fill="#d9482e"/><ellipse cx="324" cy="424" rx="18" ry="11" fill="#d9482e" transform="rotate(35 324 424)"/>
      <!-- الرأس -->
      <circle cx="256" cy="190" r="54" fill="url(#skin)"/>
      <path d="M202 186 c 4 -40 24 -60 54 -60 s 50 20 54 60 c -10 -18 -30 -26 -54 -26 s -44 8 -54 26z" fill="#3b2314"/>
      <!-- القناع -->
      <path d="M212 182 c 12 -8 26 -8 44 -2 c 18 -6 32 -6 44 2 c -4 22 -18 32 -44 24 c -26 8 -40 -2 -44 -24z" fill="#2f4fa8"/>
      <ellipse cx="238" cy="192" rx="8" ry="9" fill="#fff"/><ellipse cx="274" cy="192" rx="8" ry="9" fill="#fff"/>
      <circle cx="240" cy="194" r="4.5" fill="#1f1a2e"/><circle cx="276" cy="194" r="4.5" fill="#1f1a2e"/>
      <path d="M238 220 c 8 10 28 10 36 0" fill="none" stroke="#a04a3a" stroke-width="5" stroke-linecap="round"/>
      <circle cx="226" cy="212" r="7" fill="#ff8e8e" opacity="0.6"/><circle cx="286" cy="212" r="7" fill="#ff8e8e" opacity="0.6"/>
      <!-- النجمة الذهبية الكبيرة -->
      <g transform="translate(356 96) rotate(15)">
        <path d="M0 -52l15 32 35 5-25 24 6 35-31-17-31 17 6-35-25-24 35-5z" fill="url(#star)" stroke="#e09a00" stroke-width="4" stroke-linejoin="round"/>
        <ellipse cx="-12" cy="-22" rx="9" ry="5" fill="#fff" opacity="0.7" transform="rotate(-30 -12 -22)"/>
      </g>
    </g>
  </g>
</svg>
