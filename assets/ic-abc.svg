<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- مكعبات الحروف A B C: تمارين الإنجليزي -->
  <defs>
    <linearGradient id="r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a9a"/><stop offset="1" stop-color="#d62c2c"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9df2c0"/><stop offset="1" stop-color="#1fa35c"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ad0ff"/><stop offset="1" stop-color="#1f6fd6"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0b1f4a" flood-opacity="0.35"/></filter>
  </defs>
  <g filter="url(#sh)" font-family="Arial Rounded MT Bold, Arial, Helvetica, sans-serif" font-weight="900" font-size="22" fill="#fff" text-anchor="middle">
    <rect x="8" y="48" width="30" height="30" rx="7" fill="url(#r)"/><text x="23" y="71">A</text>
    <rect x="58" y="48" width="30" height="30" rx="7" fill="url(#b)"/><text x="73" y="71">C</text>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="2.4s" repeatCount="indefinite"/>
      <rect x="33" y="18" width="30" height="30" rx="7" fill="url(#g)"/><text x="48" y="41">B</text>
    </g>
  </g>
</svg>
