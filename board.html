<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>السبورة الذكية</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="kids-theme.css">
  <link rel="stylesheet" href="board.css">
  
</head>
<body class="board-body kids-mode">

  <!-- Header -->
  <header class="board-header">
    <a href="index.html" class="back-btn" title="رجوع">🏠</a>
    <button id="exit-landscape-btn" class="exit-landscape" type="button" title="العودة للوضع الطولي">📱 خروج من العرض</button>
    
    <div class="piggy-bal-board" id="piggy-bal-board" style="display: flex;">
      <img src="assets/piggy.svg" alt="">
      <span>حصالتك: <b id="board-piggy-amount"></b></span>
    </div>
    
    <div class="level-indicator" id="level-indicator">
      مستوى <span id="current-level-text">١</span>
    </div>
  </header>

  <!-- Question Area -->
  <div class="question-area">
    <h2 id="question-text">جاري التجهيز...</h2>
    <button id="audio-btn" class="audio-btn" type="button" aria-label="أعد السؤال">🔊</button>
  </div>

  <!-- Drawing Area -->
  <div class="canvas-container" id="canvas-container">
    <!-- One wide board: numbers, and whole connected words when the AI reader is reachable -->
    <div id="board-wrap" class="board-wrap">
      <span id="guide" class="guide"></span>
      <canvas id="main-board" class="drawing-canvas"></canvas>
      <div id="board-toast" class="board-toast" hidden></div>
    </div>

    <!-- One box per letter (offline words) -->
    <div id="word-boxes" class="word-boxes-container" style="display: none;"></div>

    <div id="thinking" class="thinking" hidden><span class="spinner"></span> أفكر...</div>
  </div>

  <!-- Toolbar -->
  <div class="board-toolbar">
    <div class="tools-row">
      <div class="colors">
        <button class="color-btn active" style="--c: #ffffff" data-color="#ffffff" aria-label="أبيض"></button>
        <button class="color-btn" style="--c: #fbbf24" data-color="#fbbf24" aria-label="أصفر"></button>
        <button class="color-btn" style="--c: #f87171" data-color="#f87171" aria-label="أحمر"></button>
        <button class="color-btn" style="--c: #60a5fa" data-color="#60a5fa" aria-label="أزرق"></button>
        <button class="color-btn" style="--c: #34d399" data-color="#34d399" aria-label="أخضر"></button>
      </div>
      <div class="sizes">
        <button class="size-btn small" data-size="5" aria-label="خط رفيع"></button>
        <button class="size-btn medium active" data-size="10" aria-label="خط متوسط"></button>
        <button class="size-btn large" data-size="18" aria-label="خط عريض"></button>
      </div>
    </div>
    <div class="actions">
      <button id="undo-btn" class="tool-btn">↩️ تراجع</button>
      <button id="clear-btn" class="tool-btn">🗑️ مسح</button>
      <button id="check-btn" class="tool-btn primary">✅ تحقق</button>
    </div>
  </div>

  <!-- Overlay to enforce Landscape -->
  <div id="landscape-overlay" class="landscape-overlay">
    <div class="landscape-msg">
      <button id="close-landscape-btn" class="landscape-close-btn" type="button" aria-label="إغلاق" title="إغلاق واللعب بالوضع الطولي">✕</button>
      <span style="font-size: 3em;">📱⤾</span>
      <h3>أدر الهاتف بالعرض!</h3>
      <p>لتكون السبورة واسعة ونتمكن من رسم كلمات طويلة، من فضلك أدر الهاتف بالعرض أو اضغط على الزر أدناه.</p>
      <div class="landscape-actions">
        <button id="fullscreen-btn" class="tool-btn primary">شاشة كاملة (بالعرض)</button>
        <button id="continue-portrait-btn" class="tool-btn secondary">المتابعة بالوضع الطولي 📱</button>
      </div>
    </div>
  </div>

  <div id="celebration-layer"></div>

  <script src="kids-theme.js"></script>
  <script src="piggy.js"></script>
  <script src="wake-lock.js"></script>
  <script src="glyph-match.js"></script>
  <script src="board.js"></script>
</body>
</html>
