<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>قصة قبل النوم - بطل المستقبل</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e2444">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="kids-theme.css">
  <link rel="stylesheet" href="story.css">
</head>
<body class="kids-mode kids-dark">
  <div class="wrap">
    
    <!-- Header -->
    <div class="top-nav">
      <a href="index.html" class="back-btn">🏠</a>
      <div class="title-box">
        <h1 id="story-title">📖 قصة قبل النوم</h1>
        <small id="story-subtitle">جاري تجهيز المغامرة...</small>
      </div>
      <div class="stats">
        <div class="pill" id="piggy-ui-wrap" style="display:none;">🐷 <b id="piggy-ui">0</b></div>
      </div>
    </div>

    <!-- Loading / Generation View -->
    <div id="loading-view" class="view-panel active">
      <!-- Twinkling Night Sky Background with Stars & Shooting Stars -->
      <div class="night-sky" id="night-sky" aria-hidden="true">
        <div class="twinkle-star s-1">✦</div>
        <div class="twinkle-star s-2">★</div>
        <div class="twinkle-star s-3">✦</div>
        <div class="twinkle-star s-4">★</div>
        <div class="twinkle-star s-5">✦</div>
        <div class="twinkle-star s-6">★</div>
        <div class="twinkle-star s-7">✦</div>
        <div class="twinkle-star s-8">★</div>
        <div class="twinkle-star s-9">✦</div>
        <div class="twinkle-star s-10">★</div>
        <div class="twinkle-star s-11">✦</div>
        <div class="twinkle-star s-12">★</div>
        <div class="shooting-star meteor-1"></div>
        <div class="shooting-star meteor-2"></div>
      </div>

      <!-- Superhero 3D Flyby Stage (Batman & Superman) -->
      <div class="superhero-flyby-stage" aria-hidden="true">
        <div class="flyer flyer-batman">
          <img src="assets/patman.png" alt="باتمان">
          <div class="flyer-trail trail-dark"></div>
        </div>
        <div class="flyer flyer-superman">
          <img src="assets/superman.png" alt="سوبرمان">
          <div class="flyer-trail trail-fire"></div>
        </div>
      </div>

      <!-- Spinner & Hero Content -->
      <div class="spinner-box">
        <!-- Centerpiece: Moon & Hero Avatar -->
        <div class="hero-centerpiece">
          <div class="moon-spinner">🌙</div>
          <div class="hero-avatar-card" id="hero-avatar-card">
            <div class="avatar-ring-pulse"></div>
            <div class="avatar-frame">
              <img id="loading-hero-img" src="assets/patman.png" alt="صورة البطل">
              <span class="hero-badge-icon" id="hero-badge-icon">⭐</span>
            </div>
            <div class="hero-name-pill" id="loading-hero-name">بطل المستقبل</div>
          </div>
        </div>

        <p class="loading-text" id="loading-stage-text">بنكتب لك قصة مخصوصة يا بطل... 🌟</p>

        <!-- 3D Progress Bar with Percentage (Starts Red, Ends Green) -->
        <div class="progress-3d-container">
          <div class="progress-3d-header">
            <span class="prog-phase" id="prog-phase-label">جاري تجهيز قصة اليوم... ✨</span>
            <span class="prog-pct-badge" id="loading-pct-badge">0%</span>
          </div>

          <div class="progress-3d-bar-outer">
            <div class="progress-3d-glow" id="progress-3d-glow"></div>
            <div class="progress-3d-bar-fill" id="loading-progress-fill" style="width: 0%;">
              <div class="progress-3d-reflection"></div>
              <div class="progress-3d-head-light"></div>
            </div>
          </div>

          <div class="prog-milestones">
            <span>✨ بداية الرحلة</span>
            <span>🦸 أبطال المغامرة</span>
            <span>🌟 وقت الحكاية!</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Story View -->
    <div id="story-view" class="view-panel">
      <div class="book-container">
        
        <!-- Progress -->
        <div class="story-progress">
          <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
          <div class="chapter-badge" id="chapter-badge">فصل ١ / ٤</div>
        </div>

        <!-- Content -->
        <div class="chapter-content">
          <div class="chapter-emoji" id="chapter-emoji">✨</div>
          <h2 class="chapter-title" id="chapter-title">...</h2>
          <p class="chapter-text" id="chapter-text">...</p>
          
          <!-- Question Area (Hidden by default) -->
          <div id="question-area" class="question-area" style="display:none;">
            <div class="q-box">
              <div class="q-icon">❓</div>
              <p class="q-text" id="q-text">...</p>
            </div>
            <div class="choices-grid" id="choices-grid">
              <!-- Choices injected here -->
            </div>
          </div>
        </div>

      </div>

      <!-- Controls -->
      <div class="controls-bar">
        <button type="button" class="ctrl-btn secondary" id="btn-prev" disabled>السابق</button>
        <button type="button" class="ctrl-btn round" id="btn-read">🔊</button>
        <button type="button" class="ctrl-btn primary" id="btn-next">التالي ➔</button>
      </div>
    </div>

    <!-- Completion View -->
    <div id="finish-view" class="view-panel">
      <div class="finish-box">
        <div class="finish-emoji">🌟</div>
        <h2>تصبح على خير يا بطل!</h2>
        <p>نهاية سعيدة لقصة جميلة.</p>
        <button class="ctrl-btn primary mt-4" onclick="location.replace('index.html')">العودة للرئيسية 🏠</button>
      </div>
    </div>

  </div>

  <script src="kids-theme.js"></script>
  <script src="back-guard.js"></script>
  <script src="ui-feedback.js"></script>
  <script src="progress.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script type="module" src="story.js"></script>
</body>
</html>
